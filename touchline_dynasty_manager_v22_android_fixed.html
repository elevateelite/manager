.lineup-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* V4 perspective match engine */
.match3d-wrap{position:relative;border:1px solid #315846;border-radius:14px;overflow:hidden;background:#07150f}
#matchCanvas{display:block;width:100%;height:auto;aspect-ratio:900/520;background:#0a2819}
.match3d-hud{position:absolute;left:12px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
.match3d-hud span{background:#06130ddd;border:1px solid #477254;border-radius:7px;padding:5px 8px;font-size:10px;color:#e8f7e9}
.match3d-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:8px}
.match3d-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.live-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live-select-grid select{width:100%;min-width:0;background:#0c1914;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}
@media(max-width:650px){.live-select-grid{grid-template-columns:1fr}.match3d-hud{left:6px;top:6px}.match3d-hud span{font-size:9px;padding:4px 6px}}


/* V5 career universe, profile and club economy */
.career-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.career-hero{background:linear-gradient(125deg,#1a4934,#10251d 70%);border:1px solid #315b43;border-radius:16px;padding:18px;display:flex;align-items:center;gap:16px}
.manager-avatar{width:70px;height:70px;display:grid;place-items:center;border-radius:18px;background:#c9fa55;color:#15210e;font-size:26px;font-weight:950;flex-shrink:0}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric-tile{background:#14241e;border:1px solid var(--line);border-radius:10px;padding:12px}
.metric-tile small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.metric-tile b{display:block;font-size:19px;margin-top:4px}
.econ-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.econ-row:last-child{border-bottom:0}
.econ-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.badge-level{display:inline-flex;padding:5px 9px;border-radius:999px;background:#2c2b19;color:#ffdc80;font-size:10px;font-weight:900;border:1px solid #67532b}
.league-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.league-chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#13241d;color:var(--text);font-size:11px}
.league-chip.active{border-color:var(--lime);color:var(--lime)}
.promotion{color:#71e0a4}.relegation{color:#ff8b8b}
@media(max-width:700px){.career-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.career-hero{align-items:flex-start}}


/* V7: immersive player silhouettes and automatic substitutions */
.auto-sub-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid #365b42;border-radius:12px;background:linear-gradient(110deg,#142b20,#101c18);margin:10px 0}
.auto-sub-panel .auto-sub-copy{display:flex;gap:10px;align-items:center;flex:1;min-width:190px}
.auto-sub-panel .auto-sub-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#c9fa55;color:#142414;font-size:20px}
.auto-sub-state{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted)}
.auto-sub-state.on{color:#c9fa55}
.match-visual-note{font-size:10px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.match-visual-note span{padding:5px 8px;border:1px solid var(--line);border-radius:999px}
@media(max-width:620px){.auto-sub-panel{align-items:stretch}.auto-sub-panel button{width:100%}}

}

function positionFit(playerPos,role){
 const groups={GK:['GK'],LB:['LB','LWB','WB'],RB:['RB','RWB','WB'],CB:['CB','SW'],DM:['DM','CDM','CM'],CM:['CM','DM','AM'],AM:['AM','CAM','CM','LW','RW'],LW:['LW','LM','AM'],RW:['RW','RM','AM'],LM:['LM','LW','CM'],RM:['RM','RW','CM'],LWB:['LWB','LB','LM'],RWB:['RWB','RB','RM'],ST:['ST','CF','AM']};
 if(playerPos===role)return 34;
 if((groups[role]||[role]).includes(playerPos))return 19;
 if(role==='CB'&&['LB','RB','DM'].includes(playerPos))return 8;
 if(['LB','RB','LWB','RWB'].includes(role)&&['CB','CM'].includes(playerPos))return 6;
 if(['LW','RW','LM','RM'].includes(role)&&['ST','CM'].includes(playerPos))return 7;
 if(role==='ST'&&['LW','RW'].includes(playerPos))return 9;

}
function chooseXIForFormation(){
 const slots=formationSlots();const pool=state.players.filter(p=>p.fitness>5).slice();const chosen=[];const used=new Set();
 // Fill scarce roles first so the strongest goalkeeper/centre-backs are not displaced by general overall ratings.
 const slotOrder=slots.map((slot,index)=>({slot,index,scarcity:pool.filter(p=>positionFit(p.pos,slot.role)>=19).length})).sort((a,b)=>a.scarcity-b.scarcity||a.index-b.index);
 const assignment=Array(slots.length).fill(null);
 for(const entry of slotOrder){
  const candidates=pool.filter(p=>!used.has(p.id)).sort((a,b)=>{
   const score=p=>positionFit(p.pos,entry.slot.role)+p.ovr*0.45+(p.fitness||0)*0.08+(p.morale||70)*0.025;
   return score(b)-score(a);
  });
  const pick=candidates[0];if(pick){assignment[entry.index]=pick;used.add(pick.id)}
 }
 return assignment.filter(Boolean);
}

function seededTable(names,division){
 const ownName=state.club;
 const key=division+'-'+state.careerWorld.seasonYear;
 if(!state.careerWorld.leagueTables[key]){
  const rows=names.map((name,i)=>({name,pts:Math.max(0,Math.round((82-i*2.1)+(Math.random()*15-7))),w:0,d:0,l:0,gf:0,ga:0,ovr:88-i%11}));
  rows.forEach(r=>{r.w=Math.floor(r.pts/3);r.d=r.pts%3===1?1:0;r.l=Math.max(0,38-r.w-r.d);r.gf=r.w*2+r.d;r.ga=Math.max(0,r.gf-(Math.floor(Math.random()*18)-5));});
  state.careerWorld.leagueTables[key]=rows;
 }
 let rows=state.careerWorld.leagueTables[key].map(r=>({...r}));
 if(division===state.careerWorld.division){
  let own=rows.find(r=>r.name===ownName);
  if(!own){own={name:ownName,pts:state.points,w:state.wins,d:state.draws,l:state.losses,gf:state.goalsFor,ga:state.goalsAgainst,ovr:teamRating()};rows[rows.length-1]=own;}
  else Object.assign(own,{pts:state.points,w:state.wins,d:state.draws,l:state.losses,gf:state.goalsFor,ga:state.goalsAgainst,ovr:teamRating()});
 }
 return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
}

function weeklyEconomy(outcome){
 const e=state.economy,m=state.manager;
 const loyaltyFactor=0.72+(Number(e.loyalty||55)/100)*0.28;const influenceFactor=1+(Number(e.fanInfluence||0)/100)*0.22;const campaignFactor=1+(Number(e.fanCampaignBonus||0)/100);const resultShift=outcome==='WIN'?900:outcome==='LOSS'?-900:0;const attendance=Math.round(Math.min(e.capacity,Math.max(7000,(e.attendance+resultShift)*loyaltyFactor*influenceFactor*campaignFactor)));
 const ticket=attendance*e.ticketPrice/1000000;
 const merch=attendance*(.000012*e.merchLevel);
 const recurring=(state.sponsorDeals||[]).reduce((sum,id)=>sum+({local:.18,global:.42,elite:.78}[id]||0),0); const sponsor=.35+.22*e.sponsorTier+(outcome==='WIN'?.08:0)+recurring;

 const operations=.18+staffCosts*.08;
 const stadiumMaintenance=(state.stadium?.level||1)*.035;
 const fanDemand=0.88+(Number(e.fanMorale||76)/100)*0.18;
 const adjustedTicket=ticket*fanDemand;
 const grossIncome=adjustedTicket+merch+sponsor;const totalExpenses=wages+operations+stadiumMaintenance;const net=grossIncome-totalExpenses;const openingBalance=state.bank;
 e.attendance=attendance;e.fanCampaignBonus=0;e.fanInfluence=Math.max(0,(e.fanInfluence||0)*.92);e.ticketIncome=adjustedTicket;e.merchIncome=merch;e.sponsorIncome=sponsor;e.lastIncome=adjustedTicket+merch+sponsor;e.lastWages=wages;
 state.bank+=net;state.budget+=Math.max(0,net*.32);e.lastLedger={week:state.week,openingBalance,grossIncome,totalExpenses,wages,operations,stadiumMaintenance,net,closingBalance:state.bank,transferAllocation:Math.max(0,net*.32),ticketIncome:adjustedTicket,merchIncome:merch,sponsorIncome:sponsor};
 m.personalBank+=m.salary/1000000; // weekly manager salary paid into personal savings
 const bizIncome=businessInvestments.filter(b=>(state.businessAssets||[]).includes(b.id)).reduce((sum,b)=>sum+b.income,0);m.personalBank+=bizIncome;state.lastBusinessIncome=bizIncome;state.businessIncomeLedger=state.businessIncomeLedger||[];if(bizIncome>0){state.businessIncomeLedger.unshift({week:state.week,amount:bizIncome,assets:businessInvestments.filter(b=>(state.businessAssets||[]).includes(b.id)).map(b=>b.name)});state.businessIncomeLedger=state.businessIncomeLedger.slice(0,30);addNews('🏭','Business portfolio revenue paid',`Your owned businesses paid ${fmt(bizIncome)} into personal savings this week, including manufacturing and stationery operations.`);}
 const academyRunning=(state.academy?.schoolsOwned||[]).reduce((sum,id)=>sum+(({community:.06,regional:.14,elite:.32}[id])||0),0);if(state.academy?.owned&&m.personalBank>=academyRunning)m.personalBank-=academyRunning;
 m.salary=Math.round(m.salary*(outcome==='WIN'&&state.wins%5===0?1.02:1));
 m.xp=Math.min(600,(m.xp||0)+(outcome==='WIN'?14:outcome==='DRAW'?8:4));
 m.careerRating=Math.min(99,Math.max(20,Math.round(m.careerRating+(outcome==='WIN'?1.3:outcome==='LOSS'?-1:.2))));
 m.leadership=Math.min(100,m.leadership+(outcome==='WIN'?1:0));
 m.tacticalIQ=Math.min(100,m.tacticalIQ+(state.formation?0.2:0));
 m.reputation=Math.min(100,m.reputation+(outcome==='WIN'?2:outcome==='DRAW'?1:0));
 e.weeklyLedger.unshift({week:state.week,label:'Matchday & weekly operations',amount:net,detail:`Income €${(adjustedTicket+merch+sponsor).toFixed(2)}M (tickets ${adjustedTicket.toFixed(2)} · merch ${merch.toFixed(2)} · sponsors ${sponsor.toFixed(2)}) · Player wages ${wages.toFixed(2)}M · Operations ${operations.toFixed(2)}M · Stadium maintenance ${stadiumMaintenance.toFixed(2)}M · Net ${net.toFixed(2)}M`});
 e.weeklyLedger=e.weeklyLedger.slice(0,30);e.lastExpenses=wages+operations+stadiumMaintenance;e.lastNet=net;
 if(net<0)m.financeSkill=Math.min(100,m.financeSkill+1);
 // Supporter mood reacts to results and feeds back into home atmosphere and commercial demand.
 e.fanMorale=Math.max(28,Math.min(99,(e.fanMorale||76)+(outcome==='WIN'?4:outcome==='DRAW'?1:-2)));e.loyalty=Math.max(20,Math.min(100,(e.loyalty||55)+(outcome==='WIN'?2:outcome==='DRAW'?1:-1)));
 if(!state.familyRequests.some(r=>r.status==='pending')&&Math.random()<.34){

function seasonRollover(){

 const relegations={'Premier League':'Championship','Championship':'League One','League One':'League Two'};
 if(state.played>=38){
  let msg=`Season ${w.seasonYear}/${w.seasonYear+1} complete. `;
  if(div==='Premier League'&&rank<=4){state.bank+=18;w.europe.ucl={season:w.seasonYear,qualified:true};msg+='Champions League qualification earned! Prize income +€18M.'}
  else if(div==='Premier League'&&rank>=5&&rank<=7){state.bank+=8;w.europe.uel={season:w.seasonYear,qualified:true};msg+='Europa League qualification earned! Prize income +€8M.'}
  if(div!=='Premier League'&&rank<=3){w.division=promotions[div]||div;msg+=` Promotion achieved to ${w.division}!`;state.manager.reputation=Math.min(100,state.manager.reputation+8);state.manager.xp+=35}
  else if(div!=='League Two'&&rank>=Math.max(1,leagueUniverse[div]?.length||24)-2){w.division=relegations[div]||div;msg+=` Relegated to ${w.division}.`}
  w.history.unshift({season:w.seasonYear,division:div,rank,points:state.points,wins:state.wins});
  w.history=w.history.slice(0,12);w.seasonYear++;state.season++;state.week=1;state.played=0;state.wins=0;state.draws=0;state.losses=0;state.points=0;state.goalsFor=0;state.goalsAgainst=0;state.results=[];
  addNews('🏆','Season review',msg);toast(msg);
 }
}

function toggleAutoSubs(){
 const m=state.liveMatch;if(!m||m.finished){toast('Start a live match first.');return}
 m.autoSubs=!m.autoSubs;
 if(m.autoSubs){runAutoSubs(false);m.events.unshift({minute:m.minute,type:'info',text:'🤖 Smart auto-substitution enabled.',detail:'The assistant will monitor fitness and make sensible changes when possible.'});}
 else m.events.unshift({minute:m.minute,type:'info',text:'🧑‍💼 Auto-substitution disabled.',detail:'You are back in full manual control.'});
 persistSilent();render();toast(m.autoSubs?'Smart auto-subs enabled.':'Smart auto-subs disabled.');
}
function runAutoSubs(manual){
 const m=state.liveMatch;if(!m||m.finished){toast('No live match to manage.');return}
 let made=0;
 const threshold=manual?78:72;
 while(m.subs<5){
  const xi=m.usedIds.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  const bench=state.players.filter(p=>!m.usedIds.includes(p.id)&&p.pos!=='GK'&&(p.fitness||0)>=45);
  const tired=xi.filter(p=>p.pos!=='GK'&&(p.fitness||100)<=threshold).sort((a,b)=>(a.fitness||0)-(b.fitness||0));
  if(!tired.length||!bench.length)break;
  const out=tired[0];
  // Prefer the same position; if none, choose a compatible broad role.
  const group=p=>['ST','CF','LW','RW','AM'].includes(p.pos)?'ATT':(['CM','DM','LM','RM'].includes(p.pos)?'MID':(['CB','LB','RB','WB'].includes(p.pos)?'DEF':p.pos));
  const candidates=bench.slice().sort((a,b)=>{
    const score=p=>(p.pos===out.pos?100:group(p)===group(out)?45:0)+(p.fitness||0)*.3+(p.ovr||0)*.2;
    return score(b)-score(a);
  });
  const inn=candidates[0];if(!inn)break;
  m.usedIds=m.usedIds.map(id=>id===out.id?inn.id:id);m.subs++;made++;
  out.fitness=Math.max(15,(out.fitness||0)-2);
  inn.fitness=Math.max(45,(inn.fitness||0)-5);
  if(!m.events)m.events=[];
  m.events.unshift({minute:m.minute,type:'sub',text:`🤖 Assistant manager: ${inn.name} replaces tired ${out.name}.`,detail:`Fitness ${out.fitness}% → ${inn.fitness}% · ${m.subs}/5 substitutions used.`});
  // Refresh lists after each change; never replace the goalkeeper automatically.
 }
 if(made){
  state.lineup=m.usedIds.slice();persistSilent();
  if(manual)toast(`Assistant made ${made} substitution${made===1?'':'s'} for tired players.`);
 }
 else if(manual)toast('No eligible tired outfield player or fresh substitute was found.');
 return made;
}

 }

   m.events.push({minute:m.minute,type:'info',text:names[Math.floor(Math.random()*names.length)],detail:m.possessionSide==='home'?'Your team builds another attack.':'The opposition are working the ball forward.'});
 }
 if(action>=.18&&action<.29){

    if(Math.random()<.16)m.events.push({minute:m.minute,type:'card',text:'Yellow card shown.',detail:'A late challenge earns a booking.'});}
 }
 const difficulty=m.difficulty||state.difficulty||'Easy'; const diffMod=difficulty==='Hard'?.88:difficulty==='Difficult'?.72:1.42; const fx=m.abilityEffects||{};const active=(id)=>Number(fx[id]||-1)>=m.minute;const attackBuff=(active('comeback')?.095:0)+(active('press')?.055:0)+(active('inspire')?.035:0)+(m.subBoost&&active('superSub')?.025:0);const defenseBuff=active('wall')?.13:0;const shotChance=(0.105+Math.max(-.02,(avg-opp.ovr)*.004)+(state.mentality==='Attacking'?.055:0)+attackBuff)*diffMod;
 if(action>=.29&&action<.29+shotChance){
   const homeAttack=m.possessionSide==='home';
   const attackRating=homeAttack?avg:opp.ovr;
   const homeBoost=(m.home&&homeAttack)?0.035:((!m.home&&!homeAttack)?0.035:0); const goalChance=Math.max(.10,Math.min(.68,(.24+(attackRating-70)*.010+(state.mentality==='Attacking'&&homeAttack?.09:0)+homeBoost+(homeAttack?attackBuff:0))*(difficulty==='Difficult'?.82:difficulty==='Hard'?.98:1.22)));
   const oppositionChanceReduction=defenseBuff+(active('inspire')?.025:0);
   if(Math.random()<goalChance*(homeAttack?1:Math.max(.25,1-oppositionChanceReduction))){
    if(homeAttack){m.gf++;m.events.push({minute:m.minute,type:'goal',text:'GOAL! A composed finish beats the goalkeeper!',detail:'The move started in midfield, the defence was split and the shot found the corner.'});}
    else {m.ga++;m.events.push({minute:m.minute,type:'goal',text:`GOAL for ${m.opponent}!`,detail:'A quick counter-attack ends with a clinical finish.'});}
   }else if(Math.random()<.48){m.events.push({minute:m.minute,type:'info',text:'What a save! The goalkeeper dives to push the shot wide.',detail:'A corner is awarded after a fingertip save.'});}
   else m.events.push({minute:m.minute,type:'info',text:'The shot flashes just wide of the post.',detail:'A promising attack ends without a goal.'});
 }
 if(m.minute===45)m.events.push({minute:45,type:'info',text:'Half-time whistle.',detail:'Review the match, change formation or make substitutions.'});
 if(m.minute>=90){finishLiveMatch();return}
 persistSilent();render();
}

 if(!outId||!inId)return toast('Select both the player coming off and the player coming on.');

 if(!out||!inn)return toast('Could not find one of those players. Please choose again.');
 m.usedIds=m.usedIds.map(id=>id===outId?inId:id);m.subs++;
 out.fitness=Math.max(20,out.fitness-5);inn.fitness=Math.max(20,inn.fitness-2);if(m.subBoost&&activeAbilityMinute(m,'superSub')){inn.morale=Math.min(100,(inn.morale||70)+12);m.events.push({minute:m.minute,type:'info',text:`✨ Super-sub impact: ${inn.name} enters with extra confidence.`,detail:'Temporary substitute bonus applied.'});}
 m.events.push({minute:m.minute,type:'sub',text:`${inn.name} replaces ${out.name}.`,detail:`${inn.pos} · ${inn.ovr} OVR. ${m.subs} of 5 substitutions used.`});
 state.lineup=m.usedIds.slice();m.subOutChoice='';m.subInChoice='';
 persistSilent();render();toast(`Substitution confirmed: ${inn.name} on for ${out.name}.`);
}

 const project=(x,y)=>({x:A.x+(B.x-A.x)*(x/100)+(D.x-A.x)*(y/100),y:A.y+(D.y-A.y)*(y/100)});

function seasonRollover(){
 if(state.played<38)return;
 const w=state.careerWorld,div=w.division,rank=rankOfClub(),seasonLabel=`${state.season}/${state.season+1}`;
 const stats=state.seasonStats||{},players=state.players;
 const scorer=[...players].sort((a,b)=>(stats[b.id]?.goals||0)-(stats[a.id]?.goals||0))[0];
 const assister=[...players].sort((a,b)=>(stats[b.id]?.assists||0)-(stats[a.id]?.assists||0))[0];
 const mvp=[...players].sort((a,b)=>{const x=stats[a.id]||{},y=stats[b.id]||{};return (y.ratingCount?y.ratingTotal/y.ratingCount:0)-(x.ratingCount?x.ratingTotal/x.ratingCount:0)})[0];
 const promotions={'League Two':'League One','League One':'Championship','Championship':'Premier League'},relegations={'Premier League':'Championship','Championship':'League One','League One':'League Two'};
 let summary=`${seasonLabel} finished. ${state.club} placed ${rank} in ${div} with ${state.points} points.`;
 let qualified='No European qualification this season.';
 if(div==='Premier League'&&rank<=4){state.bank+=18;w.europe.ucl={season:w.seasonYear,qualified:true};qualified='Qualified for the Champions League · €18M prize income.'}
 else if(div==='Premier League'&&rank<=7){state.bank+=8;w.europe.uel={season:w.seasonYear,qualified:true};qualified='Qualified for the Europa League · €8M prize income.'}
 let movement='No division change.';
 if(div!=='Premier League'&&rank<=3){w.division=promotions[div]||div;movement=`Promotion achieved to ${w.division}!`;state.manager.reputation=Math.min(100,state.manager.reputation+8);state.manager.xp+=35}
 else if(div!=='League Two'&&rank>=Math.max(1,leagueUniverse[div]?.length||24)-2){w.division=relegations[div]||div;movement=`Relegated to ${w.division}.`}
 const awardSeason=seasonLabel;
 if(scorer&&(stats[scorer.id]?.goals||0)>0)state.awardHistory.unshift({season:awardSeason,name:'Golden Boot',winner:scorer.name,detail:`${stats[scorer.id].goals} goals`});
 if(assister&&(stats[assister.id]?.assists||0)>0)state.awardHistory.unshift({season:awardSeason,name:'Top Assists',winner:assister.name,detail:`${stats[assister.id].assists} assists`});
 if(mvp)state.awardHistory.unshift({season:awardSeason,name:'Club Player of the Season',winner:mvp.name,detail:`${stats[mvp.id]?.ratingCount? (stats[mvp.id].ratingTotal/stats[mvp.id].ratingCount).toFixed(2):'—'} average match rating`});
 state.awardHistory.unshift({season:awardSeason,name:'League Best Player',winner:mvp?.name||'No winner',detail:'Season average rating leader'});
 state.seasonReviews.unshift({season:awardSeason,club:state.club,division:div,rank,points:state.points,record:`${state.wins}W ${state.draws}D ${state.losses}L`,goalsFor:state.goalsFor,goalsAgainst:state.goalsAgainst,qualified,movement});
 state.seasonReviews=state.seasonReviews.slice(0,40);state.awardHistory=state.awardHistory.slice(0,100);
 w.history.unshift({season:w.seasonYear,division:div,rank,points:state.points,wins:state.wins});w.history=w.history.slice(0,40);
 if((state.season-2025)>=40){state.careerComplete=true;state.page='overview';state.pendingSeasonReview=true;addNews('🏆','Career complete',`You completed the 40-season manager career. Final season: ${summary}`);persistSilent();return;}
 w.seasonYear++;state.season++;state.week=1;state.played=0;state.wins=0;state.draws=0;state.losses=0;state.points=0;state.goalsFor=0;state.goalsAgainst=0;state.results=[];state.seasonStats={};state.pendingSeasonReview=true;
 state.budget=Math.max(15,Math.min(160,state.budget*.82+(rank<=4?22:rank<=10?12:4)));
 state.boardTarget=rank<=4?'Win the league and reach a European final':rank<=10?'Qualify for European competition':'Finish in the top half';
 state.seasonBudgetSet=true;
 addNews('🏆','Season review completed',`${summary} ${qualified} ${movement} New season budget ${fmt(state.budget)}. Board target: ${state.boardTarget}.`);
 persistSilent();
}

function openClubAcquisition(id){const c=ownershipMarket.find(x=>x.id===id);if(!c)return;const m=state.manager;const maxDebt=Math.min(70,25+Math.floor((m.reputation||0)/2));const equityNeed=c.price*(1-maxDebt/100);$('#modal').innerHTML=`<div class="eyebrow">CONFIDENTIAL ACQUISITION DOSSIER</div><h3 style="font-size:25px;margin:8px 0">${c.emoji} ${c.name}</h3><p>${c.note}</p><div class="owner-modal-grid"><div class="owner-field"><small>PURCHASE PRICE</small><b>€${c.price}M</b></div><div class="owner-field"><small>YOUR MINIMUM EQUITY</small><b>€${equityNeed.toFixed(1)}M</b></div><div class="owner-field"><small>MAX FINANCING</small><b>${maxDebt}%</b></div><div class="owner-field"><small>EST. WEEKLY DEBT SERVICE</small><b>€${(c.price*(maxDebt/100)*.006).toFixed(2)}M</b></div></div><div class="owner-field" style="margin-top:10px"><small>YOUR PERSONAL SAVINGS</small><b>€${(m.personalBank||0).toFixed(2)}M</b><input id="ownerEquity" class="owner-slider" type="range" min="${equityNeed}" max="${Math.max(equityNeed,Math.min(c.price,m.personalBank||0))}" step="0.1" value="${Math.min(c.price,Math.max(equityNeed,m.personalBank||0))}" oninput="$('#ownerEquityLabel').textContent='€'+Number(this.value).toFixed(1)+'M equity'"/><div id="ownerEquityLabel" style="color:var(--lime);font-weight:900;margin-top:5px">Set equity contribution</div></div><div class="ownership-risk" style="margin-top:10px">The club becomes a separate financial entity. Your Manager Career salary continues to build personal wealth, while the owned club must fund its own wages, facilities and debt service.</div><div class="action-row" style="margin-top:12px"><button class="primary" onclick="app.buyClub('${c.id}')">Complete acquisition</button><button onclick="app.closeModal()">Cancel</button></div>`;$('#modalBack').classList.add('show');setTimeout(()=>{const e=$('#ownerEquity');if(e)$('#ownerEquityLabel').textContent='€'+Number(e.value).toFixed(1)+'M equity'},0)}
function buyClub(id){const c=ownershipMarket.find(x=>x.id===id),m=state.manager,o=state.ownership||{};if(!c)return;const maxDebt=Math.min(70,25+Math.floor((m.reputation||0)/2));const minEq=c.price*(1-maxDebt/100);const slider=Number($('#ownerEquity')?.value||minEq);if(m.personalBank<slider)return toast('Your manager wealth cannot fund that equity contribution. Keep building your career fortune.');if(slider<minEq)return toast('The bank requires more equity for this acquisition.');m.personalBank-=slider;o.owned=true;o.club={...c};o.equity=slider;o.debt=c.price-slider;o.weeklyDebtService=o.debt*.006;o.clubCash=Math.max(8,c.price*.04);o.boardConfidence=72;o.ownerReputation=Math.min(100,(m.reputation||0)+8);o.facilityLevel=1;o.history=[];o.staff=o.staff||{};o.targets=['Avoid relegation','Break even within 2 seasons','Increase academy output'];addNews('🏦','Club acquisition completed',`You acquired ${c.name} for €${c.price}M with €${slider.toFixed(1)}M equity and €${o.debt.toFixed(1)}M financing.`);persistSilent();closeModal();render();toast(`${c.name} is now under your ownership.`)}
function ownerHire(id){const o=state.ownership,m=ownerStaffCatalog.find(x=>x.id===id);if(!o?.owned)return;const current=o.staff?.[id];if(current)return ownerFire(id,true);const name=m.names[Math.floor(Math.random()*m.names.length)],level=1+Math.floor(Math.random()*3),salary=m.cost*(.85+level*.12);o.staff=o.staff||{};o.staff[id]={name,role:m.role,level,salary,impact:m.impact};o.clubCash-=salary*6;o.boardConfidence=Math.min(100,(o.boardConfidence||68)+2);persistSilent();render();toast(`${name} appointed as ${m.role}.`)}
function ownerFire(id,silent=false){const o=state.ownership,st=o.staff?.[id];if(!st)return;if(!silent&&!confirm(`Dismiss ${st.name} as ${st.role}? Severance will cost approximately €${(st.salary*4).toFixed(2)}M.`))return;const cost=st.salary*4;if(o.clubCash<cost)return toast('The club cannot currently afford the severance package.');o.clubCash-=cost;delete o.staff[id];o.boardConfidence=Math.max(10,(o.boardConfidence||68)-1);persistSilent();render();toast(`${st.name} has left the club.`)}
function ownerInvest(name,cost,impact){const o=state.ownership;if(!o?.owned)return;if(o.clubCash<cost)return toast('Insufficient club cash. Improve revenue or wait for the next ownership week.');o.clubCash-=cost;o.facilityLevel=Math.min(8,(o.facilityLevel||1)+1);o.club.value*=1+impact/1000;o.club.commercial=Math.min(99,(o.club.commercial||60)+Math.round(impact/3));o.club.facilities=Math.min(99,(o.club.facilities||60)+Math.round(impact/2));o.boardConfidence=Math.min(100,(o.boardConfidence||68)+4);o.ownerReputation=Math.min(100,(o.ownerReputation||0)+3);addNews('🏗️',`${name} investment approved`,`Ownership invested €${cost}M into ${name}. Club value and long-term performance outlook improved.`);persistSilent();render();toast(`${name} investment completed.`)}
function ownerAdvanceWeek(){const o=state.ownership,c=o.club;if(!o?.owned)return;const revenue=(c.commercial*.035)+(c.fan*.018)+(c.facilities*.012)+(o.facilityLevel*.08);const staffCost=Object.values(o.staff||{}).reduce((x,v)=>x+(v.salary||0),0);const operations=o.facilityLevel*.05;const net=revenue-staffCost-operations-(o.weeklyDebtService||0);o.clubCash+=net;o.history=o.history||[];o.history.unshift({week:state.week,net,revenue,staffCost,operations,debt:o.weeklyDebtService||0});o.history=o.history.slice(0,12);c.value=Math.max(20,c.value*(1+(net>=0?.002:-.004)));o.boardConfidence=Math.max(5,Math.min(99,(o.boardConfidence||68)+(net>=0?1:-2)));o.ownerReputation=Math.max(0,Math.min(100,(o.ownerReputation||0)+(net>=0?0.5:-0.5)));state.week++;if(state.week>38){state.week=1;state.season++;}persistSilent();render();toast(`Ownership week advanced: ${net>=0?'+':'−'}€${Math.abs(net).toFixed(2)}M club result.`)}
function ownerDividend(){const o=state.ownership;if(!o?.owned)return;if(o.clubCash<2)return toast('Keep a stronger cash reserve before paying a dividend.');const dividend=Math.min(o.clubCash*.18,Math.max(0,o.clubCash-1));o.clubCash-=dividend;o.lastDividend=dividend;state.manager.personalBank+=dividend;o.boardConfidence=Math.max(10,(o.boardConfidence||68)-2);addNews('💶','Owner dividend declared',`You withdrew €${dividend.toFixed(2)}M from club cash. Board confidence dipped slightly after the distribution.`);persistSilent();render();toast(`€${dividend.toFixed(2)}M transferred to personal wealth.`)}
function ownerMeeting(type){const o=state.ownership;if(!o?.owned)return;const effects={sporting:['Sporting review',3,'Head coach and recruitment priorities aligned with the board.'],finance:['Finance review',2,'Cash runway, debt and capital projects reviewed.'],supporters:['Supporter council',4,'Supporters respond positively to visible long-term investment.']};const [title,boost,detail]=effects[type]||effects.sporting;o.boardConfidence=Math.min(100,(o.boardConfidence||68)+boost);o.ownerReputation=Math.min(100,(o.ownerReputation||0)+1);addNews('🧭',title,detail);persistSilent();render();toast(`${title} complete.`)}
